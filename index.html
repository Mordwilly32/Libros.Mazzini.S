<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Mi Biblioteca</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Nunito', sans-serif;
  background: #0d0b1a;
  color: #fff;
  overflow-x: hidden;
  min-height: 100vh;
}

.starfield {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}
.starfield::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 15% 25%, rgba(180,120,255,.22) 0%, transparent 50%),
    radial-gradient(ellipse at 85% 75%, rgba(60,220,200,.16) 0%, transparent 50%),
    radial-gradient(ellipse at 55% 5%,  rgba(255,100,180,.13) 0%, transparent 45%);
}
.star {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  animation: twinkle linear infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: .1; transform: scale(1); }
  50%       { opacity: .9; transform: scale(1.5); }
}

.deco {
  position: fixed;
  pointer-events: none;
  z-index: 0;
  opacity: .1;
  font-size: 2.6rem;
  animation: floatY ease-in-out infinite;
}
@keyframes floatY {
  0%, 100% { transform: translateY(0) rotate(-5deg); }
  50%       { transform: translateY(-20px) rotate(5deg); }
}

header {
  position: relative;
  z-index: 10;
  text-align: center;
  padding: 52px 20px 16px;
}
.logo-emoji {
  font-size: 5rem;
  display: block;
  animation: bounce 2.2s ease-in-out infinite;
  filter: drop-shadow(0 0 20px rgba(255,200,80,.5));
}
@keyframes bounce {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50%       { transform: translateY(-15px) rotate(3deg); }
}
header h1 {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(3rem, 7vw, 5rem);
  line-height: 1;
  background: linear-gradient(120deg, #ffe066, #ff6eb4, #43e8d8, #b983ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 22px rgba(255,180,80,.3));
  margin-bottom: 8px;
}
header p {
  color: rgba(255,255,255,.4);
  font-size: 1rem;
  font-weight: 700;
}

.section {
  position: relative;
  z-index: 10;
  max-width: 1400px;
  margin: 44px auto 0;
  padding: 0 32px 70px;
}

.section-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 30px;
  padding-bottom: 16px;
  border-bottom: 2px solid rgba(255,255,255,.07);
  flex-wrap: wrap;
}
.section-icon {
  font-size: 2.2rem;
}
.section-info {
  flex: 1;
}
.section-title {
  font-family: 'Fredoka One', cursive;
  font-size: 2rem;
  line-height: 1.1;
}
.section-sub {
  color: rgba(255,255,255,.4);
  font-size: .9rem;
  font-weight: 700;
  margin-top: 3px;
}
.section-badge {
  font-family: 'Fredoka One', cursive;
  font-size: .9rem;
  padding: 5px 16px;
  border-radius: 20px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.12);
  white-space: nowrap;
}

.sec1 .section-title { color: #ff6eb4; text-shadow: 0 0 20px rgba(255,110,180,.4); }
.sec1 .section-badge { color: #ff6eb4; border-color: rgba(255,110,180,.3); background: rgba(255,110,180,.07); }

.sec2 .section-title { color: #43e8d8; text-shadow: 0 0 20px rgba(67,232,216,.4); }
.sec2 .section-badge { color: #43e8d8; border-color: rgba(67,232,216,.3); background: rgba(67,232,216,.07); }

.books-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
  gap: 40px 30px;
}

.book {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 13px;
  cursor: pointer;
  animation: popIn .55s cubic-bezier(.175,.885,.32,1.275) both;
  --c: #b983ff;
}
@keyframes popIn {
  from { opacity: 0; transform: translateY(26px) scale(.84) rotate(-3deg); }
  to   { opacity: 1; transform: translateY(0)    scale(1)   rotate(0deg); }
}

.book-scene {
  width: 155px;
  height: 218px;
  perspective: 800px;
  position: relative;
}

.book-body {
  width: 155px;
  height: 218px;
  position: relative;
  transform-style: preserve-3d;
  transform: rotateX(3deg) rotateY(-22deg);
  will-change: transform;
  filter: drop-shadow(5px 14px 22px rgba(0,0,0,.8));
  transition: filter .3s;
}
.book-body.lit {
  filter:
    drop-shadow(0 22px 42px rgba(0,0,0,.95))
    drop-shadow(0 0 32px var(--c));
}

.b-front {
  position: absolute;
  width: 155px;
  height: 218px;
  transform: translateZ(22px);
  border-radius: 3px 8px 8px 3px;
  overflow: hidden;
  background: var(--c);
  backface-visibility: hidden;
}

.b-front canvas {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.b-fallback {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px;
  background: linear-gradient(
    135deg,
    var(--c),
    color-mix(in srgb, var(--c), #000 50%)
  );
}
.b-fallback .fe {
  font-size: 2.8rem;
}
.b-fallback .ft {
  font-family: 'Fredoka One', cursive;
  font-size: .82rem;
  color: rgba(255,255,255,.95);
  text-align: center;
  line-height: 1.3;
  word-break: break-word;
}

.b-front::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 4;
  background: linear-gradient(135deg, rgba(255,255,255,.15) 0%, transparent 50%);
  pointer-events: none;
  border-radius: inherit;
}

.b-spine {
  position: absolute;
  width: 22px;
  height: 218px;
  left: 0;
  top: 0;
  transform: rotateY(-90deg) translateX(-22px);
  transform-origin: left center;
  background: linear-gradient(
    90deg,
    color-mix(in srgb, var(--c), #000 70%),
    color-mix(in srgb, var(--c), #000 45%)
  );
  backface-visibility: hidden;
}

.b-back {
  position: absolute;
  width: 155px;
  height: 218px;
  transform: translateZ(-22px);
  background: color-mix(in srgb, var(--c), #000 65%);
  border-radius: 8px 3px 3px 8px;
  backface-visibility: hidden;
}

.b-top {
  position: absolute;
  width: 155px;
  height: 22px;
  top: 0;
  left: 0;
  background: color-mix(in srgb, var(--c), #000 50%);
  transform: rotateX(90deg) translateY(-11px);
  transform-origin: top center;
  backface-visibility: hidden;
}

.b-bottom {
  position: absolute;
  width: 155px;
  height: 22px;
  bottom: 0;
  left: 0;
  background: color-mix(in srgb, var(--c), #000 55%);
  transform: rotateX(-90deg) translateY(11px);
  transform-origin: bottom center;
  backface-visibility: hidden;
}

.book-shadow {
  width: 105px;
  height: 12px;
  background: radial-gradient(ellipse, rgba(0,0,0,.65) 0%, transparent 70%);
  filter: blur(4px);
  margin-top: -2px;
  transition: all .3s;
}
.book.hovered .book-shadow {
  width: 125px;
  opacity: .3;
  transform: translateY(7px);
}

.open-tag {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.75);
  border: 1px solid var(--c);
  color: var(--c);
  font-family: 'Fredoka One', cursive;
  font-size: .65rem;
  padding: 3px 11px;
  border-radius: 20px;
  opacity: 0;
  transition: opacity .2s;
  pointer-events: none;
  white-space: nowrap;
  z-index: 5;
}
.book.hovered .open-tag {
  opacity: 1;
}

.book-name {
  width: 155px;
  text-align: center;
  font-weight: 800;
  font-size: .84rem;
  color: rgba(255,255,255,.85);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  transition: color .25s;
}
.book.hovered .book-name {
  color: var(--c);
}

.empty-section {
  color: rgba(255,255,255,.25);
  font-size: .95rem;
  font-weight: 700;
  padding: 10px 0;
}
.empty-section code {
  color: #43e8d8;
  background: rgba(67,232,216,.1);
  padding: 2px 8px;
  border-radius: 6px;
  font-size: .85rem;
}

footer {
  position: relative;
  z-index: 10;
  text-align: center;
  padding: 30px;
  color: rgba(255,255,255,.12);
  font-family: 'Fredoka One', cursive;
  font-size: .9rem;
}
</style>
</head>
<body>

<div class="starfield"></div>

<div class="deco" style="top:7%;left:2.5%;animation-duration:6s">📖</div>
<div class="deco" style="top:28%;right:3.5%;animation-duration:8s;animation-delay:1s">✨</div>
<div class="deco" style="top:52%;left:1.8%;animation-duration:7s;animation-delay:2s">🌙</div>
<div class="deco" style="top:73%;right:4%;animation-duration:9s;animation-delay:.5s">⭐</div>
<div class="deco" style="top:87%;left:7%;animation-duration:5.5s;animation-delay:3s">🔖</div>

<header>
  <span class="logo-emoji">📚</span>
  <h1>Mi Biblioteca</h1>
  <p>haz clic en un libro para abrirlo ✨</p>
</header>

<div class="section sec1">
  <div class="section-header">
    <span class="section-icon">💻</span>
    <div class="section-info">
      <div class="section-title">Sección 1 — Libros de Programación</div>
      <div class="section-sub">lenguajes, algoritmos y desarrollo web</div>
    </div>
    <div class="section-badge" id="badge1">...</div>
  </div>
  <div class="books-grid" id="grid1"></div>
</div>

<div class="section sec2">
  <div class="section-header">
    <span class="section-icon">🌐</span>
    <div class="section-info">
      <div class="section-title">Sección 2 — Libros Extras</div>
      <div class="section-sub">más recursos y lecturas recomendadas</div>
    </div>
    <div class="section-badge" id="badge2">...</div>
  </div>
  <div class="books-grid" id="grid2"></div>
</div>

<footer>made by: pixeltoast 🍞</footer>

<script>
const PDF_FOLDER1 = "libros/";
const BOOKS1 = [
  "MEBO_memoria.pdf",
  "Programaci-n-Web-del-Frontend-al-Backend-Ricardo-Javier-Cel-P-rraga-Miguel-Fabricio-Bon-Andrade-Aldo-Patricio-Mora-Olivero.pdf",
  "Algoritmos-y-programaci-n-gu-a-para-docentes-Juan-Carlos-L-pez-Garc-a.pdf",
  "curso-de-desarrollo-web-en-entorno-de-servidor-pedro-r-benito-da-rocha.pdf",
  "Introducci-n-a-la-Programaci-n-Javier-Pino-Herrera-Patricia-Mart-nez-Moreno.pdf",
  "Professional C++ (3rd Edition) by Marc Gregoire 2014 PDF - PDF Room.pdf",
  "html.pdf",
  "Head First JavaScript Programming - Wickedly Smart - PDF Room.pdf",
  "04.-El-lenguaje-de-programaci-n-C-autor-Jos-Antonio-Gonz-lez-Seco.pdf",
  "programacion_web.pdf"
];

const PDF_FOLDER2 = "libros2/";
const BOOKS2 = [];

const COLORS = [
  '#ff6eb4','#b983ff','#43e8d8','#ffe066','#6fffb0',
  '#ff9f43','#4facfe','#f093fb','#43e97b','#fa709a',
  '#a18cd1','#fda085','#96fbc4','#f6d365','#89f7fe',
  '#ff8c69','#c39bd3','#7dcea0'
];
const EMOJIS = [
  '📖','📕','📗','📘','📙','📔','📓','📒','📃','🗒️','📜','📄'
];

pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

(function() {
  const cols = ['#ffe066','#ff9f43','#ff6eb4','#43e8d8','#b983ff','#ffffff'];
  const sf   = document.querySelector('.starfield');
  for (let i = 0; i < 100; i++) {
    const el  = document.createElement('div');
    el.className = 'star';
    const sz = 1 + Math.random() * 2.5;
    const c  = cols[Math.floor(Math.random() * cols.length)];
    el.style.cssText =
      `width:${sz}px; height:${sz}px;` +
      `left:${Math.random() * 100}vw; top:${Math.random() * 100}vh;` +
      `background:${c}; box-shadow:0 0 ${sz * 3}px ${c};` +
      `animation-duration:${2 + Math.random() * 4}s;` +
      `animation-delay:${Math.random() * 6}s;`;
    sf.appendChild(el);
  }
})();

function init() {
  renderSection('grid1', 'badge1', BOOKS1, PDF_FOLDER1, 0);
  renderSection('grid2', 'badge2', BOOKS2, PDF_FOLDER2, BOOKS1.length);
}

function renderSection(gridId, badgeId, books, folder, colorOffset) {
  const grid  = document.getElementById(gridId);
  const badge = document.getElementById(badgeId);

  if (books.length === 0) {
    badge.textContent = '0 libros';
    grid.innerHTML =
      `<p class="empty-section">
         Agregá PDFs al array <strong>BOOKS</strong> y a la carpeta
         <code>${folder}</code> para ver libros aquí 📂
       </p>`;
    return;
  }

  badge.textContent = `${books.length} libro${books.length !== 1 ? 's' : ''}`;

  books.forEach(function(filename, i) {
    const globalIndex = colorOffset + i;
    const color = COLORS[globalIndex % COLORS.length];
    const emoji = EMOJIS[globalIndex % EMOJIS.length];
    const uid   = gridId + '-' + i;

    var bookEl = makeBook(filename, folder, uid, color, emoji, i);
    grid.appendChild(bookEl);
  });

  books.forEach(function(filename, i) {
    var uid = gridId + '-' + i;
    renderThumb(folder + filename, uid);
  });
}

function makeBook(filename, folder, uid, color, emoji, index) {
  var url = folder + filename;

  var name = filename
    .replace(/\.pdf$/i, '')
    .replace(/[-_]/g, ' ')
    .replace(/\s{2,}/g, ' ')
    .trim();

  var book = document.createElement('div');
  book.className = 'book';
  book.style.setProperty('--c', color);
  book.style.animationDelay = (index * 0.065).toFixed(2) + 's';

  book.innerHTML =
    '<div class="book-scene">' +
      '<div class="book-body" id="body-' + uid + '">' +
        '<div class="b-front" id="front-' + uid + '">' +
          '<div class="b-fallback" id="fallback-' + uid + '">' +
            '<span class="fe">' + emoji + '</span>' +
            '<span class="ft">' + esc(name) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="b-spine"></div>' +
        '<div class="b-back"></div>' +
        '<div class="b-top"></div>' +
        '<div class="b-bottom"></div>' +
      '</div>' +
      '<div class="open-tag">📄 abrir</div>' +
    '</div>' +
    '<div class="book-shadow"></div>' +
    '<div class="book-name">' + esc(name) + '</div>';

  attachSpin(book, uid);

  book.addEventListener('click', function() {
    window.open(url, '_blank');
  });

  return book;
}

async function renderThumb(url, uid) {
  var frontEl    = document.getElementById('front-'    + uid);
  var fallbackEl = document.getElementById('fallback-' + uid);

  if (!frontEl) return;

  try {
    var loadingTask = pdfjsLib.getDocument(url);
    var pdf         = await loadingTask.promise;
    var page        = await pdf.getPage(1);
    var viewport    = page.getViewport({ scale: 1.0 });

    var canvas  = document.createElement('canvas');
    var context = canvas.getContext('2d');
    canvas.height = viewport.height;
    canvas.width  = viewport.width;

    var renderContext = {
      canvasContext: context,
      viewport: viewport
    };
    
    await page.render(renderContext).promise;

    if (fallbackEl) {
      fallbackEl.remove();
    }
    frontEl.appendChild(canvas);

  } catch (e) {
    console.warn('[portada fallida]', url, e.message);
  }
}

function attachSpin(bookEl, uid) {
  var scene   = bookEl.querySelector('.book-scene');
  var tX = 3, tY = -22;
  var cX = 3, cY = -22;
  var raf = null;
  var over = false;

  function lerp(a, b, t) { return a + (b - a) * t; }

  function tick() {
    cX = lerp(cX, tX, 0.11);
    cY = lerp(cY, tY, 0.11);
    var bodyEl = document.getElementById('body-' + uid);
    if (bodyEl) {
      bodyEl.style.transform =
        'rotateX(' + cX + 'deg) rotateY(' + cY + 'deg)';
    }
    var stillMoving = Math.abs(cX - tX) > 0.04 || Math.abs(cY - tY) > 0.04;
    raf = (stillMoving || over) ? requestAnimationFrame(tick) : null;
  }

  scene.addEventListener('mouseenter', function() {
    over = true;
    bookEl.classList.add('hovered');
    var bodyEl = document.getElementById('body-' + uid);
    if (bodyEl) bodyEl.classList.add('lit');
    if (!raf) raf = requestAnimationFrame(tick);
  });

  scene.addEventListener('mousemove', function(e) {
    var r  = scene.getBoundingClientRect();
    var nx = (e.clientX - r.left)  / r.width  - 0.5;
    var ny = (e.clientY - r.top)   / r.height - 0.5;
    tY =  nx * 80;
    tX = -ny * 50;
  });

  scene.addEventListener('mouseleave', function() {
    over = false;
    bookEl.classList.remove('hovered');
    var bodyEl = document.getElementById('body-' + uid);
    if (bodyEl) bodyEl.classList.remove('lit');
    tX = 3; tY = -22;
    if (!raf) raf = requestAnimationFrame(tick);
  });
}

function esc(s) {
  return s
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

init();
</script>
</body>
</html>
